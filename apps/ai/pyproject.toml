[project]
name = "mediwork-ai"
version = "0.1.0"
description = "근무표 자동 생성 (CP-SAT) 및 자연어 제약 해석"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ortools>=9.11",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]
# 자연어 제약 해석에만 필요하다. 없어도 CP-SAT 생성은 동작한다.
nl = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
